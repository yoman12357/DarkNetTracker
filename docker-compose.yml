services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      APP_DEFAULT_USER: admin
      APP_DEFAULT_PASS: admin123
      APP_ANALYST_USER: analyst
      APP_ANALYST_PASS: analyst123
      APP_VIEWER_USER: viewer
      APP_VIEWER_PASS: viewer123
      PORT: 4000
      HOST: 0.0.0.0
      AUTH_TOKEN_TTL_HOURS: 8
    volumes:
      - ./backend/data:/workspace/backend/data
      - ./backend/uploads:/workspace/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - backend

volumes: {}
